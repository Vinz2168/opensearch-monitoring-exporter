name: Build and Test OpenSearch Monitoring Exporter

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
        java: [21]
    name: Build and Test (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5.6.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Build and Run Tests
        run: ./gradlew build

      - name: Publish plugin ZIP to staging repository
        run: ./gradlew publishPluginZipPublicationToZipStagingRepository
